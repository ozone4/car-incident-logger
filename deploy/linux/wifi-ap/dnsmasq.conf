# dnsmasq.conf — DHCP for Car Logger Wi-Fi AP
#
# Filled in by scripts/linux/setup_wifi_ap.sh.
# Only serves DHCP on the AP interface; does not interfere with the system resolver.

# Only listen on the AP interface (not eth0 / system LAN)
interface=__INTERFACE__

# Do not read /etc/resolv.conf or forward DNS queries
no-resolv
no-poll

# DHCP range — iPad gets an address in __DHCP_START__ .. __DHCP_END__
dhcp-range=__DHCP_START__,__DHCP_END__,255.255.255.0,24h

# Lenovo AP address (also the dashboard URL)
dhcp-option=option:router,__STATIC_IP__
dhcp-option=option:dns-server,__STATIC_IP__

# Serve the dashboard at carlogger.local (optional mDNS fallback)
address=/carlogger.local/__STATIC_IP__

# DHCP lease file
dhcp-leasefile=/var/lib/dnsmasq/car-logger-ap.leases

# Log queries (useful for debugging; disable in production)
# log-queries
log-dhcp

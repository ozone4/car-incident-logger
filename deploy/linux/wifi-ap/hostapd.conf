# hostapd.conf — Wi-Fi Access Point for Car Logger
#
# Fill in the __PLACEHOLDERS__ or run scripts/linux/setup_wifi_ap.sh which
# substitutes values from config.yaml automatically.
#
# Reference: https://w1.fi/cgit/hostap/plain/hostapd/hostapd.conf

# Wi-Fi interface (must NOT be managed by NetworkManager while in AP mode)
interface=__INTERFACE__

# Driver — nl80211 works for most Linux Wi-Fi chipsets
driver=nl80211

# AP identifiers
ssid=__SSID__
country_code=__COUNTRY_CODE__

# 2.4 GHz, channel 6 (change to 1 or 11 if interference)
hw_mode=g
channel=6

# 802.11n (HT) — improves throughput for video streaming
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-40][DSSS_CCK-40]

# WPA2 security (comment out wpa_* lines for an open network)
# Leave __WPA_PASSPHRASE__ empty to disable WPA and create an open AP.
__WPA_BLOCK__

# Broadcast SSID
ignore_broadcast_ssid=0

# Logging (0=verbose, 3=errors only)
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

camera:
  # ThinkPad install: /dev/video0 is the built-in webcam; Arducam usually starts at /dev/video2.
  device_index: 2
  resolution:
    width: 1920
    height: 1080
  fps: 30
  format: MJPG  # MJPG, H264, or YUV

buffer:
  duration_seconds: 45  # rolling buffer length

audio:
  device_index: null  # null = system default
  sample_rate: 16000
  channels: 1

transcription:
  model: base.en           # tiny.en, base.en, small.en, medium.en
  device: cpu              # cpu or cuda
  compute_type: int8       # int8, float16, float32

button:
  mode: keyboard           # keyboard or gpio
  key: space               # keyboard key (space, enter, f1, etc.)
  gpio_pin: 17             # BCM pin for GPIO mode
  gpio_pull: up            # up or down (pull resistor)

storage:
  base_path: ./data
  max_incident_age_days: 90
  max_recording_age_days: 7       # auto-delete recordings older than this
  min_free_space_gb: 2            # delete oldest recordings when free space drops below
  cleanup_interval_seconds: 300   # how often to check (seconds)

alpr:
  enabled: false
  confidence_threshold: 0.5    # minimum combined det+OCR confidence to report a plate
  yolo_confidence_threshold: 0.1 # minimum YOLO box confidence before OCR crop
  yolo_imgsz: 1280             # YOLO input size in pixels (must be multiple of 32); larger = better distant plate detection, slower inference
  vehicle_detection_enabled: true   # detect vehicles first, then search for plates within each vehicle crop (much better range)
  vehicle_model_path: yolov8n.pt    # COCO general detector; ultralytics auto-downloads ~6 MB on first run
  vehicle_confidence_threshold: 0.3
  vehicle_fallback_to_fullframe: true  # if no vehicles detected, fall back to direct full-frame plate scan
  ocr_fallback_when_no_detections: true  # if YOLO finds no plate boxes, try whole-frame OCR for small/test plates
  fullframe_ocr_confidence_threshold: 0.60
  scan_interval_seconds: 1.0
  # Path to a YOLO plate-detection model (.pt file). Requires ultralytics installed.
  # Download a plate-specific model (e.g. keremberke/license-plate-object-detection)
  # and place it here, or point to any custom-trained YOLOv8/v11 plate weights.
  yolo_model_path: ./data/models/plate_detector.pt
  models_dir: ./data/models

known_vehicles:
  profiles:
    - name: Owen black Honda CR-V
      enabled: true
      make: Honda
      model: CR-V
      color: black
      vehicle_type: SUV
      expected_zones:
        - driveway
        - home
      # Add partial plate fragments here if the plate is sometimes visible.
      # Example: ["ABC", "123"]
      plate_fragments: []
      # Require multiple traits so we do not ignore every black SUV.
      min_score: 0.75
      min_matched_traits: 3

recording:
  enabled: true
  segment_duration_seconds: 60    # segment length in seconds
  output_path: ./data/recordings

overlay:
  enabled: true
  position: bottom-left           # top-left, top-right, bottom-left, bottom-right
  font_scale: 0.7
  color: [255, 255, 255]          # white BGR
  background: true                # dark rectangle behind text

dashcam:
  auto_start_camera: true     # start camera/buffer when web app starts
  auto_start_alpr: true       # start Live ALPR automatically when available
  pre_roll_seconds: 30       # seconds of video before trigger to include
  post_roll_seconds: 5       # seconds of video after trigger to capture
  output_path: ./data/dashcam  # where incident clips are saved

appliance:
  enabled: true
  app_url: http://127.0.0.1:5000
  check_interval_seconds: 5
  battery_grace_seconds: 600      # after AC loss, keep recording this long before suspend
  critical_battery_percent: 12    # suspend immediately at/below this battery level
  stop_before_suspend: true       # stop camera/recording and sync files before suspend
  restart_after_resume: true      # ask app to restart camera after resume
  suspend_command: systemctl suspend
  state_file: ./data/appliance-power-state.json

notifier:
  chime_enabled: false
  chime_file: ./data/config/chime.wav
  console_alerts: true

logging:
  level: INFO              # DEBUG, INFO, WARNING, ERROR
  file: ./data/logs/system.log
  max_bytes: 10485760      # 10 MB
  backup_count: 3

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1024, initial-scale=1"/>
<title>dashlog — in‑car dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard/styles.css') }}"/>
</head>
<body>
<div id="root" aria-label="Dashboard"></div>
<span class="kiosk-hero" hidden>Dashboard</span>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="{{ url_for('static', filename='dashboard/tweaks-panel.jsx') }}"></script>
<script type="text/babel" src="{{ url_for('static', filename='dashboard/app.jsx') }}"></script>

<script>
/* Letterbox-fit the 1024×600 .app to viewport */
(function(){
  function fit() {
    var app = document.querySelector('.app');
    if (!app) { requestAnimationFrame(fit); return; }
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / 1024, h / 600);
    app.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  setInterval(fit, 500);
})();
</script>
</body>
</html>
